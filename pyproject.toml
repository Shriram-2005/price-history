[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-history"
version = "0.1.0"
description = "Personal price-intelligence and grocery staple tracker for quick-commerce (Swiggy Instamart)"
readme = "PRICE_HISTORY_PRD.md"
requires-python = ">=3.11"
authors = [
    { name = "Price History Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "aiofiles>=24.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
]

[project.scripts]
price-history = "src.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]
